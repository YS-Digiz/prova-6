<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Memory Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            padding: 20px;
            background: #f0f0f0;
        }
        #griglia {
            display: grid;
            gap: 10px;
            margin: 20px auto;
            width: fit-content;
        }
        #griglia.facile {
            grid-template-columns: repeat(2, 100px);
        }
        #griglia.medio {
            grid-template-columns: repeat(4, 100px);
        }
        #griglia.difficile {
            grid-template-columns: repeat(6, 100px);
        }
        button.carta {
            width: 100px;
            height: 100px;
            font-size: 16px;
            cursor: pointer;
            background: #3498db;
            border: 3px solid #2980b9;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }
        button.carta:hover {
            background: #2980b9;
        }
        button.carta:disabled {
            background: #2ecc71;
            border-color: #27ae60;
        }
    </style>
</head>
<body>
    <h1>Memory Game</h1>
    
    <label>Difficoltà:</label>
    <select id="diff">
        <option value="2">Facile (2x2)</option>
        <option value="4">Medio (4x4)</option>
        <option value="6">Difficile (6x6)</option>
    </select>
    <button id="btnStart" onclick="start()">Inizia</button>
    
    <h2 id="contatore" style="display:none;">Tentativi: <span id="tentativi">0</span></h2>
    <div id="griglia"></div>
    <h2> funziona tutto git hub</h2>
    <script src="script.js"> </script>
</body>
</html>
